<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>타블룻 대국 - Board Arena</title>
<link rel="stylesheet" href="../../shared/css/common.css" />
<link rel="stylesheet" href="../../shared/css/square-board.css" />
<style>
  .layout { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .board-col { width: 460px; flex-shrink: 0; }
  .panel { flex: 1; min-width: 260px; }
  .panel select { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
  .panel button { padding: 8px 14px; border-radius: 6px; border: 1px solid #ccc; background: white; cursor: pointer; margin-right: 6px; margin-bottom: 10px; }
  .status-line { font-size: 15px; font-weight: 600; margin: 10px 0; }
  .thinking { font-size: 13px; color: var(--accent); display: none; }
  .move-log { font-size: 13px; color: #666; max-height: 220px; overflow-y: auto; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
</style>
</head>
<body>
  <script>
    window.addEventListener('error', (e) => {
      const el = document.getElementById('error-overlay');
      if (el) { el.style.display = 'block'; el.textContent = '오류 발생: ' + (e.message || e.error); }
    });
  </script>
  <div id="error-overlay" style="display:none;background:#fce8e6;color:#b3261e;padding:12px;border-radius:8px;margin-bottom:16px;font-size:13px;white-space:pre-wrap;"></div>
  <main>
    <h1>타블룻 대국</h1>
    <p style="color:#777;font-size:14px;">1732년 린네가 기록한 사미족의 전통 타플(Tafl) 게임입니다. 수비측(스웨덴군 8명+왕)은 왕을 네 귀퉁이 중 하나로 탈출시키면 승리, 공격측(모스크바군 16명)은 왕을 사방(또는 옥좌 포함 3면)으로 포위하면 승리합니다. 기물은 룩처럼 직선으로 움직이고, 상대 기물을 양옆에서 샌드위치하면 잡습니다.</p>
    <div class="layout">
      <div id="board-col" class="board-col"></div>
      <div class="panel">
        <label style="font-size:13px;color:#555;display:block;margin-bottom:4px;">내 진영</label>
        <select id="side-select">
          <option value="D">수비 (왕+스웨덴군)</option>
          <option value="A">공격 (모스크바군)</option>
        </select>
        <label style="font-size:13px;color:#555;display:block;margin-bottom:4px;">AI 난이도</label>
        <select id="level-select">
          <option value="1">1단</option>
          <option value="2">2단</option>
          <option value="3" selected>3단</option>
          <option value="4">4단</option>
          <option value="5">5단</option>
          <option value="6">6단</option>
          <option value="7">7단</option>
          <option value="8">8단</option>
          <option value="9">9단</option>
        </select>
        <button id="new-game-btn">새 게임</button>
        <button id="resign-btn">기권</button>
        <div id="status-line" class="status-line">불러오는 중...</div>
        <div id="thinking" class="thinking">AI가 생각 중...</div>
        <div id="move-log" class="move-log"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { SquareBoard } from '../../shared/js/square-board.js';

    const SIZE = 9;
    const THRONE = { x: 4, y: 4 };
    const CORNERS = [{ x: 0, y: 0 }, { x: 0, y: 8 }, { x: 8, y: 0 }, { x: 8, y: 8 }];

    const SETUP = [
      '___ttt___',
      '____t____',
      '____T____',
      't___T___t',
      'ttTTKTTtt',
      't___T___t',
      '____T____',
      '____t____',
      '___ttt___',
    ];

    const GLYPHS = { A: '●', D: '○', K: '♔' };

    const boardCol = document.getElementById('board-col');
    const sideSelect = document.getElementById('side-select');
    const levelSelect = document.getElementById('level-select');
    const statusLine = document.getElementById('status-line');
    const thinkingEl = document.getElementById('thinking');
    const moveLog = document.getElementById('move-log');

    let board = [];
    let ui = null;
    let humanSide = 'D';
    let gameOver = false;
    let selected = null;
    let turn = 'A';

    function log(text) { const p = document.createElement('div'); p.textContent = text; moveLog.prepend(p); }
    function opponent(s) { return s === 'A' ? 'D' : 'A'; }
    function isThrone(x, y) { return x === THRONE.x && y === THRONE.y; }
    function isCorner(x, y) { return CORNERS.some((c) => c.x === x && c.y === y); }
    function pieceSide(p) { return p === 'A' ? 'A' : (p ? 'D' : null); }

    function initialBoard() {
      const b = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          const ch = SETUP[y][x];
          if (ch === 't') b[y][x] = 'A';
          else if (ch === 'T') b[y][x] = 'D';
          else if (ch === 'K') b[y][x] = 'K';
        }
      }
      return b;
    }

    function slideMoves(b, x, y) {
      const p = b[y][x];
      if (!p) return [];
      const moves = [];
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        let nx = x + dx, ny = y + dy;
        while (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE) {
          if (b[ny][nx]) break;
          if (isThrone(nx, ny) && p !== 'K') break;
          moves.push({ x: nx, y: ny });
          nx += dx; ny += dy;
        }
      }
      return moves;
    }

    function allMoves(b, side) {
      const moves = [];
      for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
        const p = b[y][x];
        if (!p) continue;
        if (pieceSide(p) !== side) continue;
        for (const m of slideMoves(b, x, y)) moves.push({ from: { x, y }, to: m });
      }
      return moves;
    }

    function isHostileTo(b, x, y, side) {
      if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return true;
      const p = b[y][x];
      if (isThrone(x, y) && !p) return true;
      if (!p) return false;
      return pieceSide(p) === side;
    }

    function applyMoveAndCapture(b, move, mover) {
      const nb = b.map((row) => row.slice());
      const piece = nb[move.from.y][move.from.x];
      nb[move.from.y][move.from.x] = null;
      nb[move.to.y][move.to.x] = piece;

      const captured = [];
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const ex = move.to.x + dx, ey = move.to.y + dy;
        if (ex < 0 || ex >= SIZE || ey < 0 || ey >= SIZE) continue;
        const target = nb[ey][ex];
        if (!target || pieceSide(target) === mover) continue;
        if (target === 'K') continue;
        const beyondX = ex + dx, beyondY = ey + dy;
        if (isHostileTo(nb, beyondX, beyondY, mover)) {
          nb[ey][ex] = null;
          captured.push({ x: ex, y: ey });
        }
      }
      return { board: nb, captured };
    }

    function findKing(b) {
      for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) if (b[y][x] === 'K') return { x, y };
      return null;
    }

    function isKingSurrounded(b) {
      const k = findKing(b);
      if (!k) return true;
      let sides = 0, total = 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = k.x + dx, ny = k.y + dy;
        total++;
        if (nx < 0 || nx >= SIZE || ny < 0 || ny >= SIZE) { sides++; continue; }
        const p = b[ny][nx];
        if (p === 'A') sides++;
        else if (isThrone(nx, ny) && !p) sides++;
      }
      return sides === total;
    }

    function syncBoard(lastMove) {
      const pieces = [];
      for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) if (board[y][x]) pieces.push({ x, y, piece: board[y][x] });
      ui.pieceGlyphs = GLYPHS;
      ui.loadPosition(pieces);
      if (lastMove) ui.markLastMove(lastMove.from, lastMove.to);
      ui.render();
    }

    function startNewGame() {
      board = initialBoard();
      turn = 'A';
      gameOver = false;
      selected = null;
      moveLog.innerHTML = '';
      boardCol.innerHTML = '';
      humanSide = sideSelect.value;
      ui = new SquareBoard({
        container: boardCol, width: SIZE, height: SIZE, interactive: true,
        onSquareClick: handleSquareClick, lightColor: '#dfc9a0', darkColor: '#c2a877',
      });
      syncBoard(null);
      updateStatus();
      log('새 게임 시작');
      if (turn !== humanSide) { thinkingEl.style.display = 'block'; setTimeout(aiTurn, 300); }
    }

    function updateStatus() {
      if (gameOver) return;
      const whoText = turn === humanSide ? '당신 차례' : 'AI 차례';
      const sideText = turn === 'A' ? '공격' : '수비';
      statusLine.textContent = `${whoText} (${sideText})`;
    }

    function checkGameOver() {
      const king = findKing(board);
      if (!king) { gameOver = true; statusLine.textContent = (humanSide === 'A' ? '당신' : 'AI') + ' 승리! (왕이 잡혔습니다)'; return true; }
      if (isCorner(king.x, king.y)) { gameOver = true; statusLine.textContent = (humanSide === 'D' ? '당신' : 'AI') + ' 승리! (왕이 탈출했습니다)'; return true; }
      if (isKingSurrounded(board)) { gameOver = true; statusLine.textContent = (humanSide === 'A' ? '당신' : 'AI') + ' 승리! (왕이 포위됐습니다)'; return true; }
      return false;
    }

    function handleSquareClick(x, y) {
      if (gameOver || turn !== humanSide) return;
      if (selected) {
        const moves = slideMoves(board, selected.x, selected.y);
        const mv = moves.find((m) => m.x === x && m.y === y);
        if (mv) {
          const lastMove = { from: selected, to: { x, y } };
          const { board: nb, captured } = applyMoveAndCapture(board, lastMove, humanSide);
          board = nb;
          selected = null;
          syncBoard(lastMove);
          log(`당신: (${lastMove.from.x},${lastMove.from.y}) → (${x},${y})` + (captured.length ? ` (${captured.length}개 포획)` : ''));
          if (checkGameOver()) return;
          turn = opponent(turn);
          updateStatus();
          thinkingEl.style.display = 'block';
          setTimeout(aiTurn, 200);
          return;
        }
      }
      const p = board[y][x];
      if (p && pieceSide(p) === humanSide) {
        selected = { x, y };
        ui.setSelection({ x, y }, slideMoves(board, x, y).map((m) => ({ x: m.x, y: m.y })));
      } else {
        selected = null;
        ui.setSelection(null, []);
      }
    }

    function evaluate(b, side) {
      const king = findKing(b);
      let score = 0;
      let attackers = 0, defenders = 0;
      for (const row of b) for (const c of row) { if (c === 'A') attackers++; else if (c === 'D') defenders++; }
      score += (side === 'A' ? attackers - defenders : defenders - attackers) * 2;
      if (king) {
        const distToCorner = Math.min(...CORNERS.map((c) => Math.abs(c.x - king.x) + Math.abs(c.y - king.y)));
        score += side === 'D' ? -distToCorner : distToCorner;
      } else {
        score += side === 'A' ? 1000 : -1000;
      }
      return score;
    }

    function aiTurn() {
      if (gameOver || turn === humanSide) { thinkingEl.style.display = 'none'; return; }
      const aiSide = turn;
      const moves = allMoves(board, aiSide);
      if (moves.length === 0) { thinkingEl.style.display = 'none'; gameOver = true; statusLine.textContent = (humanSide === aiSide ? 'AI' : '당신') + ' 승리 (상대가 둘 수 없음)'; return; }
      const level = parseInt(levelSelect.value, 10);
      const mistakeChance = [0.55, 0.38, 0.22, 0.12, 0.06, 0.02, 0, 0, 0][level - 1];
      let best;
      if (Math.random() < mistakeChance) {
        best = moves[Math.floor(Math.random() * moves.length)];
      } else {
        let bestScore = -Infinity;
        for (const m of moves) {
          const { board: nb, captured } = applyMoveAndCapture(board, m, aiSide);
          let score = evaluate(nb, aiSide) + captured.length * 5;
          if (score > bestScore) { bestScore = score; best = m; }
        }
      }
      const { board: nb, captured } = applyMoveAndCapture(board, best, aiSide);
      board = nb;
      syncBoard(best);
      log(`AI: (${best.from.x},${best.from.y}) → (${best.to.x},${best.to.y})` + (captured.length ? ` (${captured.length}개 포획)` : ''));
      thinkingEl.style.display = 'none';
      if (checkGameOver()) return;
      turn = opponent(turn);
      updateStatus();
      if (turn !== humanSide) { thinkingEl.style.display = 'block'; setTimeout(aiTurn, 300); }
    }

    document.getElementById('new-game-btn').addEventListener('click', startNewGame);
    document.getElementById('resign-btn').addEventListener('click', () => {
      if (gameOver) return;
      gameOver = true;
      statusLine.textContent = '기권했습니다.';
      log('기권');
    });
    sideSelect.addEventListener('change', startNewGame);

    startNewGame();
  </script>
</body>
</html>
