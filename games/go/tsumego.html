<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>바둑 학습 - Board Arena</title>
<link rel="stylesheet" href="../../shared/css/common.css" />
<link rel="stylesheet" href="../../shared/css/board-common.css" />
<style>
  .quiz-layout { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .quiz-board { width: 380px; flex-shrink: 0; }
  .quiz-panel { flex: 1; min-width: 300px; max-width: 500px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 12px; border-radius: 16px; border: 1px solid #ccc; background: white; cursor: pointer; font-size: 13px; }
  .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .cat-btn.active { background: #444; border-color: #444; }
  .score-line { font-size: 13px; color: #666; margin-left: auto; }
  .quiz-question { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .quiz-hint { font-size: 13px; color: #888; margin-bottom: 10px; }
  .result-banner { font-weight: 700; font-size: 15px; margin: 10px 0; padding: 8px 12px; border-radius: 6px; display: none; }
  .result-correct { background: #e6f4ea; color: #1e7a34; }
  .result-wrong { background: #fce8e6; color: #b3261e; }
  .kifu-panel { display: none; margin-top: 14px; padding: 12px; background: #f7f7f7; border-radius: 8px; }
  .kifu-caption { font-size: 13px; color: #555; margin-bottom: 8px; min-height: 18px; }
  .kifu-controls { display: flex; gap: 6px; margin-bottom: 10px; }
  .kifu-controls button { padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; background: white; cursor: pointer; font-size: 13px; }
  .explanation-text { font-size: 13px; color: #444; margin-bottom: 10px; line-height: 1.6; }
  .branch-list { margin-top: 12px; }
  .branch-title { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
  .branch-item { display: block; width: 100%; text-align: left; padding: 7px 10px; margin-bottom: 6px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; font-size: 13px; }
  .branch-item.selected { border-color: var(--accent); background: #f0f7f3; }
  .next-btn { padding: 8px 18px; border-radius: 6px; border: none; background: var(--accent); color: white; cursor: pointer; font-size: 14px; display: none; margin-top: 10px; }
  .kifu-board-inline { width: 220px; margin: 0 auto; }
</style>
</head>
<body>
  <main>
    <h1>바둑 학습</h1>
    <p style="color:#777;font-size:14px;">한 수를 클릭해서 답하면, 정답과 검증된 다른 시도들을 기보로 보여드립니다.</p>

    <div class="toolbar">
      <span style="font-size:13px;color:#888;">분야:</span>
      <button class="cat-btn filter-btn active" data-cat="tsumego">사활</button>
      <button class="cat-btn filter-btn" data-cat="fuseki">포석</button>
      <button class="cat-btn filter-btn" data-cat="middlegame">중반 전투</button>
      <button class="cat-btn filter-btn" data-cat="endgame">끝내기</button>
    </div>
    <div id="objective-toolbar" class="toolbar">
      <span style="font-size:13px;color:#888;">목표:</span>
      <button class="obj-btn filter-btn active" data-obj="all">전체</button>
      <button class="obj-btn filter-btn" data-obj="capture">잡기(공격)</button>
      <button class="obj-btn filter-btn" data-obj="live">살기(수비)</button>
    </div>
    <div class="toolbar">
      <span style="font-size:13px;color:#888;">난이도:</span>
      <select id="kyu-select" style="padding:5px 10px;border-radius:16px;border:1px solid #ccc;font-size:13px;"></select>
      <span id="score-line" class="score-line">0 / 0 정답</span>
    </div>

    <div class="quiz-layout">
      <div id="quiz-board" class="quiz-board"></div>
      <div class="quiz-panel">
        <div id="quiz-question" class="quiz-question"></div>
        <div id="quiz-hint" class="quiz-hint">바둑판 위에서 최선이라고 생각하는 자리를 클릭하세요.</div>
        <div id="result-banner" class="result-banner"></div>
        <div id="explanation-text" class="explanation-text"></div>

        <div id="kifu-panel" class="kifu-panel">
          <div id="kifu-board-inline" class="kifu-board-inline"></div>
          <div id="kifu-caption" class="kifu-caption"></div>
          <div class="kifu-controls">
            <button id="kifu-prev">◀ 이전</button>
            <button id="kifu-play">▶ 자동재생</button>
            <button id="kifu-next">다음 ▶</button>
            <button id="kifu-reset">처음으로</button>
          </div>
          <div id="branch-list" class="branch-list"></div>
        </div>

        <button id="next-btn" class="next-btn">다음 문제 →</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { GoBoard } from './js/go-board.js';
    import { KifuPlayer } from '../../shared/js/kifu-player.js';

    let tsumegoProblems = [];
    let quizProblems = [];
    let pool = [];
    let current = null;
    let correctCount = 0;
    let attemptCount = 0;
    let board = null;
    let kifu = null;
    let answered = false;

    const boardContainer = document.getElementById('quiz-board');
    const questionEl = document.getElementById('quiz-question');
    const hintEl = document.getElementById('quiz-hint');
    const resultBanner = document.getElementById('result-banner');
    const explanationTextEl = document.getElementById('explanation-text');
    const kifuPanel = document.getElementById('kifu-panel');
    const kifuBoardInline = document.getElementById('kifu-board-inline');
    const kifuCaption = document.getElementById('kifu-caption');
    const branchListEl = document.getElementById('branch-list');
    const nextBtn = document.getElementById('next-btn');
    const scoreLine = document.getElementById('score-line');
    const objectiveToolbar = document.getElementById('objective-toolbar');
    const kyuSelect = document.getElementById('kyu-select');

    // 18급~1급 드롭다운 채우기
    const allOpt = document.createElement('option');
    allOpt.value = 'all';
    allOpt.textContent = '전체';
    kyuSelect.appendChild(allOpt);
    for (let k = 18; k >= 1; k--) {
      const opt = document.createElement('option');
      opt.value = `k${k}`;
      opt.textContent = `${k}급`;
      kyuSelect.appendChild(opt);
    }
    kyuSelect.addEventListener('change', applyFilter);

    async function loadProblems() {
      const [tsumegoRes, quizRes] = await Promise.all([
        fetch('../../data/go/tsumego.json'),
        fetch('../../data/go/quiz.json'),
      ]);
      const tsumegoData = await tsumegoRes.json();
      const quizData = await quizRes.json();
      tsumegoProblems = tsumegoData.problems;
      quizProblems = quizData.problems;
      applyFilter();
    }

    function currentCategory() {
      return document.querySelector('.cat-btn.active').dataset.cat;
    }

    function applyFilter() {
      const cat = currentCategory();
      const diff = kyuSelect.value; // 'all' 또는 'k18'..'k1'
      objectiveToolbar.style.display = cat === 'tsumego' ? 'flex' : 'none';

      if (cat === 'tsumego') {
        const obj = document.querySelector('.obj-btn.active').dataset.obj;
        pool = tsumegoProblems
          .filter((p) => (diff === 'all' || p.difficulty === diff) && (obj === 'all' || p.objective === obj))
          .map((p) => normalizeTsumego(p));
      } else {
        pool = quizProblems
          .filter((p) => p.category === cat && (diff === 'all' || p.difficulty === diff))
          .map((p) => normalizeQuiz(p));
      }
      shuffle(pool);
      loadNextProblem();
    }

    // 문제에 등장하는 주요 지점들을 감싸는 크롭 영역 계산 (판 전체가 아니라 핵심만 보이게)
    function computeRegion(stones, correctPoint, wrongBranches) {
      const pts = [...stones, correctPoint, ...wrongBranches.map((b) => ({ x: b.x, y: b.y }))];
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (const p of pts) {
        minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      }
      return { minX, maxX, minY, maxY, padding: 2 };
    }

    // tsumego.json 문제를 공통 형식으로 변환
    function normalizeTsumego(p) {
      const groupColorText = p.groupColor === 'B' ? '흑' : '백';
      const moverText = p.mover === 'B' ? '흑' : '백';
      const objectiveText = p.objective === 'capture' ? '잡는' : '살리는';
      const correctPoint = { x: p.mainLine[0].x, y: p.mainLine[0].y };
      const wrongBranches = p.wrongBranches.map((b) => ({
        x: b.x, y: b.y,
        followupMoves: b.punish.map((m) => ({ x: m.x, y: m.y, color: m.color })),
        hasVerifiedPunish: true,
      }));
      return {
        source: 'tsumego',
        size: p.size,
        stones: p.stones,
        mover: p.mover,
        correctPoint,
        question: `[${p.kyuLevel}급] ${groupColorText} 그룹을 ${objectiveText} 첫 수는? (${moverText} 차례)`,
        explanationText: p.objective === 'capture'
          ? '표시된 자리가 이 그룹의 급소로, 이후 어떻게 저항해도 그룹을 살릴 수 없습니다.'
          : '표시된 자리가 이 그룹의 급소로, 여기를 두면 두 눈을 확보해 완전히 살아납니다.',
        mainLineMoves: p.mainLine.map((m) => ({ x: m.x, y: m.y, color: m.color })),
        wrongBranches,
        viewRegion: computeRegion(p.stones, correctPoint, wrongBranches),
      };
    }

    // quiz.json 문제를 공통 형식으로 변환
    function normalizeQuiz(p) {
      const moverText = p.toMove === 'B' ? '흑' : '백';
      const correctOpt = p.options.find((o) => o.label === p.correctLabel);
      const correctPoint = { x: correctOpt.x, y: correctOpt.y };
      const wrongBranches = p.options
        .filter((o) => o.label !== p.correctLabel)
        .map((o) => ({ x: o.x, y: o.y, followupMoves: [], hasVerifiedPunish: false }));
      return {
        source: 'quiz',
        size: p.size,
        stones: p.stones,
        mover: p.toMove,
        correctPoint,
        question: `[${p.kyuLevel}급 · ${catLabel(p.category)}] ${moverText} 차례입니다. 다음 최선의 수는?`,
        explanationText: p.explanation,
        mainLineMoves: [{ x: correctOpt.x, y: correctOpt.y, color: p.toMove }],
        wrongBranches,
        viewRegion: computeRegion(p.stones, correctPoint, wrongBranches),
      };
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function loadNextProblem() {
      if (pool.length === 0) {
        questionEl.textContent = '이 조건의 문제를 모두 풀었습니다! 다시 섞어서 진행합니다.';
        applyFilter();
        return;
      }
      current = pool.pop();
      renderProblem(current);
    }

    function catLabel(c) {
      return { fuseki: '포석', middlegame: '중반 전투', endgame: '끝내기' }[c] || c;
    }

    function renderProblem(problem) {
      answered = false;
      resultBanner.style.display = 'none';
      explanationTextEl.textContent = '';
      kifuPanel.style.display = 'none';
      nextBtn.style.display = 'none';
      hintEl.style.display = 'block';

      boardContainer.innerHTML = '';
      board = new GoBoard({
        container: boardContainer,
        size: problem.size,
        interactive: true,
        onPointClick: (x, y) => handlePointClick(x, y, problem),
        viewRegion: problem.viewRegion,
      });
      board.loadPosition(problem.stones);
      questionEl.textContent = problem.question;
    }

    function handlePointClick(x, y, problem) {
      if (answered) return;
      const occupied = problem.stones.some((s) => s.x === x && s.y === y);
      if (occupied) return;

      answered = true;
      attemptCount++;

      const isCorrect = problem.correctPoint.x === x && problem.correctPoint.y === y;
      if (isCorrect) correctCount++;

      board.markAnswerFeedback(problem.correctPoint, { x, y });

      hintEl.style.display = 'none';
      resultBanner.style.display = 'block';
      resultBanner.className = 'result-banner ' + (isCorrect ? 'result-correct' : 'result-wrong');
      resultBanner.textContent = isCorrect ? '✅ 정답입니다!' : '❌ 아쉽습니다. 정답과 다른 시도들을 확인해보세요.';
      explanationTextEl.textContent = problem.explanationText;

      showKifuExplanation(problem, { x, y }, isCorrect);

      scoreLine.textContent = `${correctCount} / ${attemptCount} 정답`;
      nextBtn.style.display = 'inline-block';
    }

    function showKifuExplanation(problem, picked, isCorrect) {
      kifuPanel.style.display = 'block';

      kifuBoardInline.innerHTML = '';
      kifu = new KifuPlayer({
        container: kifuBoardInline,
        size: problem.size,
        initialStones: problem.stones,
        moves: problem.mainLineMoves,
        captionEl: kifuCaption,
        captions: problem.mainLineMoves.map((m, i) => (i === 0 ? '정답 수' : `이어지는 진행 (${i + 1}수째)`)),
        viewRegion: problem.viewRegion,
      });
      kifu.next();

      branchListEl.innerHTML = '';
      if (problem.wrongBranches.length > 0) {
        const title = document.createElement('div');
        title.className = 'branch-title';
        title.textContent = '다른 시도들 (눌러서 재생)';
        branchListEl.appendChild(title);

        const correctBtn = document.createElement('button');
        correctBtn.className = 'branch-item selected';
        correctBtn.textContent = '✅ 정답 수순 보기';
        correctBtn.addEventListener('click', () => {
          setSelectedBranch(correctBtn);
          kifu.loadSequence({
            initialStones: problem.stones,
            moves: problem.mainLineMoves,
            captions: problem.mainLineMoves.map((m, i) => (i === 0 ? '정답 수' : `이어지는 진행 (${i + 1}수째)`)),
          });
          kifu.next();
        });
        branchListEl.appendChild(correctBtn);

        problem.wrongBranches.forEach((branch, idx) => {
          const btn = document.createElement('button');
          btn.className = 'branch-item';
          const isThisOnePicked = !isCorrect && picked.x === branch.x && picked.y === branch.y;
          const tag = branch.hasVerifiedPunish ? '실패 (응징 수순 검증됨)' : '최선이 아님';
          btn.textContent = `❌ 시도 ${idx + 1}${isThisOnePicked ? ' (방금 두신 수)' : ''} - ${tag}`;
          btn.addEventListener('click', () => {
            setSelectedBranch(btn);
            const branchMoves = [{ x: branch.x, y: branch.y, color: problem.mover }, ...branch.followupMoves];
            kifu.loadSequence({
              initialStones: problem.stones,
              moves: branchMoves,
              captions: branchMoves.map((m, i) => (i === 0 ? '이 수를 시도하면...' : '상대가 이렇게 응징합니다')),
            });
            if (branchMoves.length > 1) kifu.playAll();
            else kifu.next();
          });
          branchListEl.appendChild(btn);

          if (isThisOnePicked) {
            setTimeout(() => btn.click(), 50);
          }
        });
      }
    }

    function setSelectedBranch(activeBtn) {
      branchListEl.querySelectorAll('.branch-item').forEach((b) => b.classList.remove('selected'));
      activeBtn.classList.add('selected');
    }

    document.getElementById('kifu-prev').addEventListener('click', () => kifu && kifu.prev());
    document.getElementById('kifu-next').addEventListener('click', () => kifu && kifu.next());
    document.getElementById('kifu-reset').addEventListener('click', () => kifu && kifu.reset());
    document.getElementById('kifu-play').addEventListener('click', () => kifu && kifu.playAll());

    nextBtn.addEventListener('click', loadNextProblem);

    document.querySelectorAll('.obj-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.obj-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter();
      });
    });
    document.querySelectorAll('.cat-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter();
      });
    });

    loadProblems();
  </script>
</body>
</html>
