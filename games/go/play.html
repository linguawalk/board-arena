<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>바둑 대국 - Board Arena</title>
<link rel="stylesheet" href="../../shared/css/common.css" />
<link rel="stylesheet" href="../../shared/css/board-common.css" />
<style>
  /* 체스 등 다른 게임 페이지와 통일: 보드는 왼쪽, 옵션 패널은 오른쪽 */
  .layout { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .board-col { width: 460px; aspect-ratio: 1 / 1; flex-shrink: 0; }
  .board-col .board-container { width: 100%; height: 100%; display: block; }
  .panel { flex: 1; min-width: 260px; }
  .panel select { width: 100%; max-width: 220px; padding: 8px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
  .panel label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
  .panel button { padding: 8px 14px; border-radius: 6px; border: 1px solid #ccc; background: white; cursor: pointer; margin-right: 6px; margin-bottom: 10px; }
  .study-nav { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .study-nav a { display: inline-block; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--accent, #4a7cff); color: var(--accent, #4a7cff); text-decoration: none; font-size: 13px; font-weight: 600; }
  .study-nav a:hover { background: var(--accent, #4a7cff); color: #fff; }
</style>
</head>
<body>
  <main>
    <h1>바둑 대국</h1>

    <!-- TODO: 실제 파일명/경로에 맞게 href를 조정해 주세요.
         review.html = 저장된 복기 목록/재생 페이지 -->
    <nav class="study-nav">
      <a href="review.html">📋 내 복기 보기</a>
    </nav>

    <div class="layout">
      <div id="board-col" class="board-col">
        <div id="go-board-container" class="board-container"></div>
      </div>

      <div class="panel">
        <label for="board-size">보드 크기</label>
        <select id="board-size" class="board-size-select">
          <option value="9">9 x 9</option>
          <option value="11">11 x 11</option>
          <option value="13">13 x 13</option>
          <option value="15">15 x 15</option>
          <option value="17">17 x 17</option>
          <option value="19" selected>19 x 19 (정식)</option>
          <option value="21">21 x 21</option>
          <option value="23">23 x 23</option>
          <option value="25">25 x 25</option>
        </select>

        <label for="ai-level">AI 난이도</label>
        <select id="ai-level" class="board-size-select"></select>
        <p style="font-size:12px;color:#888;margin:0 0 10px;">※ 지금은 임시 휴리스틱 AI로 급수를 실수 확률로 흉내낸 것입니다. 추후 KataGo 엔진으로 교체 예정.</p>

        <button id="pass-btn">패스</button>
        <button id="resign-btn">기권</button>
        <button id="save-review-btn">복기용으로 저장</button>
        <div id="save-msg" style="font-size:12px;color:var(--accent);display:none;">저장됐습니다. 복기 페이지에서 확인하세요.</div>

        <div id="turn-indicator" style="font-size:15px;font-weight:600;margin:10px 0;">현재 차례: 흑</div>
        <div id="capture-indicator" style="font-size:13px;color:#555;">흑의 사석: 0 · 백의 사석: 0</div>
        <div id="ai-thinking" style="font-size:13px;color:var(--accent);display:none;">AI가 생각 중...</div>
        <div id="move-log" style="font-size: 13px; color: #555; max-height: 200px; overflow-y: auto; margin-top:10px; border-top:1px solid #eee; padding-top:8px;"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { GoBoard } from './js/go-board.js';
    import { GoEngineAdapter, AI_LEVELS } from './js/go-engine-adapter.js';

    const container = document.getElementById('go-board-container');
    const sizeSelect = document.getElementById('board-size');
    const levelSelect = document.getElementById('ai-level');
    const turnIndicator = document.getElementById('turn-indicator');
    const captureIndicator = document.getElementById('capture-indicator');
    const aiThinking = document.getElementById('ai-thinking');
    const moveLog = document.getElementById('move-log');

    const AI_COLOR = 'W'; // AI는 항상 백, 사람은 흑(선)

    // 급수 옵션 채우기
    for (const lvl of AI_LEVELS) {
      const opt = document.createElement('option');
      opt.value = lvl.id;
      opt.textContent = lvl.label;
      if (lvl.id === 'd9') opt.selected = true;
      levelSelect.appendChild(opt);
    }

    function logLine(text) {
      const p = document.createElement('div');
      p.textContent = text;
      moveLog.prepend(p);
    }

    let engine = new GoEngineAdapter({ level: levelSelect.value });
    let board;

    function createBoard() {
      const size = parseInt(sizeSelect.value, 10);
      container.innerHTML = '';
      board = new GoBoard({ container, size, onMove: handleMoveResult });
      turnIndicator.textContent = '현재 차례: 흑';
      captureIndicator.textContent = '흑의 사석: 0 · 백의 사석: 0';
      moveLog.innerHTML = '';
      logLine(`${size}x${size} 보드로 시작 (흑 선)`);
    }

    function handleMoveResult(result) {
      if (!result.valid) {
        logLine(`착수 실패: ${result.reason}`);
        return;
      }
      if (result.pass) {
        logLine(`패스 (다음 차례: ${result.nextTurn === 'B' ? '흑' : '백'})`);
      } else {
        const capturedText = result.captured.length ? ` / ${result.captured.length}점 따냄` : '';
        logLine(`(${result.x}, ${result.y}) 착수${capturedText}`);
      }
      turnIndicator.textContent = `현재 차례: ${result.nextTurn === 'B' ? '흑' : '백'}`;
      captureIndicator.textContent = `흑의 사석: ${result.capturedBlack} · 백의 사석: ${result.capturedWhite}`;

      if (result.nextTurn === AI_COLOR) {
        requestAiMove();
      }
    }

    async function requestAiMove() {
      aiThinking.style.display = 'block';
      try {
        const move = await engine.requestMove(
          board.state,
          AI_COLOR,
          board.width,
          board.height,
          board.koState
        );
        if (move.pass) {
          board.pass();
        } else {
          board.handleInput(move.x, move.y);
        }
      } catch (err) {
        logLine(`AI 오류: ${err.message}`);
      } finally {
        aiThinking.style.display = 'none';
      }
    }

    createBoard();

    sizeSelect.addEventListener('change', createBoard);

    levelSelect.addEventListener('change', () => {
      engine = new GoEngineAdapter({ level: levelSelect.value });
      logLine(`AI 난이도를 "${levelSelect.options[levelSelect.selectedIndex].text}"로 변경`);
    });

    document.getElementById('pass-btn').addEventListener('click', () => board.pass());
    document.getElementById('resign-btn').addEventListener('click', () => {
      logLine('기권 처리 (추후 구현: 결과 저장 및 복기 화면 이동)');
    });

    document.getElementById('save-review-btn').addEventListener('click', () => {
      const games = JSON.parse(localStorage.getItem('board-arena-go-games') || '[]');
      games.unshift({
        id: Date.now(),
        savedAt: new Date().toISOString(),
        size: board.width,
        history: board.history,
      });
      // 최근 30개까지만 보관
      localStorage.setItem('board-arena-go-games', JSON.stringify(games.slice(0, 30)));
      const msg = document.getElementById('save-msg');
      msg.style.display = 'block';
      setTimeout(() => (msg.style.display = 'none'), 2500);
    });
  </script>
</body>
</html>
