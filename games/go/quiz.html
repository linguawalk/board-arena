<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>바둑 퀴즈 - Board Arena</title>
<link rel="stylesheet" href="../../shared/css/common.css" />
<link rel="stylesheet" href="../../shared/css/board-common.css" />
<style>
  .quiz-layout { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .quiz-board { width: 380px; flex-shrink: 0; }
  .quiz-panel { flex: 1; min-width: 280px; max-width: 480px; }
  .quiz-toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .diff-btn { padding: 6px 12px; border-radius: 16px; border: 1px solid #ccc; background: white; cursor: pointer; font-size: 13px; }
  .diff-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .cat-btn { padding: 6px 12px; border-radius: 16px; border: 1px solid #ccc; background: white; cursor: pointer; font-size: 13px; }
  .cat-btn.active { background: #444; color: white; border-color: #444; }
  .score-line { font-size: 13px; color: #666; margin-left: auto; }
  .quiz-question { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
  .quiz-option { display: block; width: 100%; text-align: left; padding: 10px 14px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 15px; }
  .quiz-option.correct { background: #e6f4ea; border-color: #34a853; }
  .quiz-option.wrong { background: #fce8e6; border-color: #ea4335; }
  .quiz-explanation { font-size: 13px; color: #555; margin: 12px 0; padding: 10px; background: #f7f7f7; border-radius: 6px; display: none; }
  .next-btn { padding: 8px 18px; border-radius: 6px; border: none; background: var(--accent); color: white; cursor: pointer; font-size: 14px; display: none; }
</style>
</head>
<body>
  <main>
    <h1>바둑 퀴즈 - 다음 최선의 수</h1>
    <div class="quiz-toolbar">
      <span style="font-size:13px;color:#888;">분야:</span>
      <button class="cat-btn active" data-cat="all">전체</button>
      <button class="cat-btn" data-cat="fuseki">포석</button>
      <button class="cat-btn" data-cat="middlegame">중반 전투</button>
      <button class="cat-btn" data-cat="endgame">끝내기</button>
    </div>
    <div class="quiz-toolbar">
      <span style="font-size:13px;color:#888;">난이도:</span>
      <button class="diff-btn active" data-diff="all">전체</button>
      <button class="diff-btn" data-diff="easy">쉬움</button>
      <button class="diff-btn" data-diff="medium">보통</button>
      <button class="diff-btn" data-diff="hard">어려움</button>
      <span id="score-line" class="score-line">0 / 0 정답</span>
    </div>

    <div class="quiz-layout">
      <div id="quiz-board" class="quiz-board"></div>
      <div class="quiz-panel">
        <div id="quiz-question" class="quiz-question"></div>
        <div id="quiz-hint" style="font-size:13px;color:#888;margin-bottom:10px;">바둑판 위에서 최선이라고 생각하는 자리를 클릭하세요.</div>
        <div id="quiz-explanation" class="quiz-explanation"></div>
        <button id="next-btn" class="next-btn">다음 문제 →</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { GoBoard } from './js/go-board.js';

    let allProblems = [];
    let pool = [];
    let current = null;
    let correctCount = 0;
    let attemptCount = 0;
    let board = null;
    let answered = false;

    const boardContainer = document.getElementById('quiz-board');
    const questionEl = document.getElementById('quiz-question');
    const hintEl = document.getElementById('quiz-hint');
    const explanationEl = document.getElementById('quiz-explanation');
    const nextBtn = document.getElementById('next-btn');
    const scoreLine = document.getElementById('score-line');

    async function loadProblems() {
      const res = await fetch('../../data/go/quiz.json');
      const data = await res.json();
      allProblems = data.problems;
      applyFilter();
    }

    function applyFilter() {
      const diff = document.querySelector('.diff-btn.active').dataset.diff;
      const cat = document.querySelector('.cat-btn.active').dataset.cat;
      pool = allProblems.filter(
        (p) => (diff === 'all' || p.difficulty === diff) && (cat === 'all' || p.category === cat)
      );
      shuffle(pool);
      loadNextProblem();
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    function loadNextProblem() {
      if (pool.length === 0) {
        if (allProblems.length === 0) return;
        questionEl.textContent = '이 조건의 문제를 모두 풀었습니다! 다시 섞어서 진행합니다.';
        applyFilter();
        return;
      }
      current = pool.pop();
      renderProblem(current);
    }

    function renderProblem(problem) {
      answered = false;
      explanationEl.style.display = 'none';
      nextBtn.style.display = 'none';
      hintEl.style.display = 'block';

      boardContainer.innerHTML = '';
      board = new GoBoard({
        container: boardContainer,
        size: problem.size,
        interactive: true,
        onPointClick: (x, y) => handlePointClick(x, y, problem),
      });
      board.loadPosition(problem.stones);

      const moverText = problem.toMove === 'B' ? '흑' : '백';
      questionEl.textContent = `[${diffLabel(problem.difficulty)} · ${catLabel(problem.category)}] ${moverText} 차례입니다. 다음 최선의 수는?`;
    }

    function diffLabel(d) {
      return { easy: '쉬움', medium: '보통', hard: '어려움' }[d] || d;
    }
    function catLabel(c) {
      return { fuseki: '포석', middlegame: '중반 전투', endgame: '끝내기' }[c] || c;
    }

    function handlePointClick(x, y, problem) {
      if (answered) return;
      // 이미 돌이 있는 자리는 무효 클릭으로 처리
      const occupied = problem.stones.some((s) => s.x === x && s.y === y);
      if (occupied) return;

      answered = true;
      attemptCount++;

      const correctOpt = problem.options.find((o) => o.label === problem.correctLabel);
      const isCorrect = correctOpt.x === x && correctOpt.y === y;
      if (isCorrect) correctCount++;

      board.markAnswerFeedback(correctOpt, { x, y });

      hintEl.style.display = 'none';
      explanationEl.textContent = (isCorrect ? '✅ 정답입니다! ' : '❌ 아쉽습니다. ') + problem.explanation;
      explanationEl.style.display = 'block';
      nextBtn.style.display = 'inline-block';
      scoreLine.textContent = `${correctCount} / ${attemptCount} 정답`;
    }

    nextBtn.addEventListener('click', loadNextProblem);

    document.querySelectorAll('.diff-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter();
      });
    });

    document.querySelectorAll('.cat-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter();
      });
    });

    loadProblems();
  </script>
</body>
</html>
