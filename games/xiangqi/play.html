<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>샹치 대국 - Board Arena</title>
<link rel="stylesheet" href="../../shared/css/common.css" />
<link rel="stylesheet" href="../../shared/css/intersection-piece-board.css" />
<style>
  .layout { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .board-col { width: 480px; flex-shrink: 0; }
  .panel { flex: 1; min-width: 260px; }
  .panel select { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
  .panel label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
  .panel button { padding: 8px 14px; border-radius: 6px; border: 1px solid #ccc; background: white; cursor: pointer; margin-right: 6px; margin-bottom: 10px; }
  .status-line { font-size: 15px; font-weight: 600; margin: 10px 0; }
  .thinking { font-size: 13px; color: var(--accent); display: none; }
  .move-log { font-size: 13px; color: #666; max-height: 220px; overflow-y: auto; margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
  .variant-desc { font-size: 12px; color: #666; background: #f7f7f7; padding: 8px 10px; border-radius: 6px; margin: -4px 0 10px; }
</style>
</head>
<body>
  <script>
    window.addEventListener('error', (e) => {
      const el = document.getElementById('error-overlay');
      if (el) {
        el.style.display = 'block';
        el.textContent = '오류 발생: ' + (e.message || e.error) + '\n' + (e.filename ? `(${e.filename}:${e.lineno})` : '');
      }
    });
    window.addEventListener('unhandledrejection', (e) => {
      const el = document.getElementById('error-overlay');
      if (el) {
        el.style.display = 'block';
        el.textContent = '오류 발생(Promise): ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
      }
    });
  </script>
  <div id="error-overlay" style="display:none;background:#fce8e6;color:#b3261e;padding:12px;border-radius:8px;margin-bottom:16px;font-size:13px;white-space:pre-wrap;"></div>
  <main>
    <h1>샹치 대국</h1>

    <div class="layout">
      <div id="board-col" class="board-col"></div>
      <div class="panel">
        <label for="variant-select">규칙</label>
        <select id="variant-select">
          <option value="xiangqi">정식 (xiangqi)</option>
          <option value="minixiangqi">미니 (7x7, 강·사·상 없음)</option>
        </select>
        <div id="variant-desc" class="variant-desc"></div>

        <label for="level-select">AI 난이도</label>
        <select id="level-select"></select>

        <button id="new-game-btn">새 게임</button>
        <button id="resign-btn">기권</button>
        <button id="save-review-btn">복기용으로 저장</button>

        <div id="status-line" class="status-line">불러오는 중...</div>
        <div id="thinking" class="thinking">AI가 생각 중...</div>
        <div id="save-msg" style="font-size:12px;color:var(--accent);display:none;">저장됐습니다.</div>
        <div id="move-log" class="move-log"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { IntersectionPieceBoard } from '../../shared/js/intersection-piece-board.js';

    async function loadFfish() {
      const wasmUrl = new URL('../../shared/js/vendor/ffish.wasm', import.meta.url).href;
      const wasmResponse = await fetch(wasmUrl);
      if (!wasmResponse.ok) {
        throw new Error(`ffish.wasm 요청 실패: HTTP ${wasmResponse.status} (${wasmUrl})`);
      }
      const wasmBinary = new Uint8Array(await wasmResponse.arrayBuffer());
      const mod = await import('../../shared/js/vendor/ffish.js');
      return mod.default({ wasmBinary });
    }

    // 샹치 기물: 帥/將(왕), 仕/士(사), 相/象(상), 馬(마), 車(차), 砲(포), 兵/卒(병)
    const GLYPHS = {
      K: '帥', A: '仕', E: '相', B: '相', H: '馬', N: '馬', R: '車', C: '砲', P: '兵',
      k: '將', a: '士', e: '象', b: '象', h: '馬', n: '馬', r: '車', c: '砲', p: '卒',
    };

    const VARIANT_INFO = {
      xiangqi: '가장 널리 쓰이는 표준 샹치(중국장기) 규칙입니다. 강을 사이에 두고 병사와 상(코끼리)의 이동이 제한됩니다.',
      minixiangqi: '7x7의 작은 판에서 두는 축소판 샹치입니다. 강이 없고, 사(仕/士)와 상(相/象)도 없이 차·마·포·병(각 5개)만으로 겨룹니다. 병은 처음부터 옆으로도 움직일 수 있습니다.',
    };

    const AI_LEVELS = [];
    for (let k = 18; k >= 1; k--) AI_LEVELS.push({ id: `k${k}`, label: `${k}급`, depth: 2 + Math.floor((18 - k) * 0.5) });
    for (let d = 1; d <= 9; d++) AI_LEVELS.push({ id: `d${d}`, label: `${d}단`, depth: 12 + d });

    const boardCol = document.getElementById('board-col');
    const variantSelect = document.getElementById('variant-select');
    const variantDesc = document.getElementById('variant-desc');
    const levelSelect = document.getElementById('level-select');
    const statusLine = document.getElementById('status-line');
    const thinkingEl = document.getElementById('thinking');
    const moveLog = document.getElementById('move-log');
    const saveMsg = document.getElementById('save-msg');

    for (const lvl of AI_LEVELS) {
      const opt = document.createElement('option');
      opt.value = lvl.id;
      opt.textContent = lvl.label;
      if (lvl.id === 'd1') opt.selected = true;
      levelSelect.appendChild(opt);
    }
    function currentDepth() {
      return Math.min(AI_LEVELS.find((l) => l.id === levelSelect.value).depth, 10);
    }
    function updateVariantDesc() {
      variantDesc.textContent = VARIANT_INFO[variantSelect.value] || '';
    }

    const BOARD_CONFIG = {
      xiangqi: {
        width: 9, height: 10,
        palaces: [{ cx: 4, cy: 1 }, { cx: 4, cy: 8 }],
        riverGap: { yTop: 4, yBottom: 5 },
      },
      minixiangqi: {
        width: 7, height: 7,
        palaces: [{ cx: 3, cy: 1 }, { cx: 3, cy: 5 }],
        riverGap: null,
      },
    };
    let boardWidth = 9, boardHeight = 10;

    let ffish = null;
    let board = null;
    let ui = null;
    let humanColor = 'w';
    let selectedPoint = null;
    let gameOver = false;
    let moveHistoryUci = [];

    function fileToX(f) { return f.charCodeAt(0) - 97; }
    function xToFile(x) { return String.fromCharCode(97 + x); }
    function rankToY(r) { return boardHeight - r; }
    function yToRank(y) { return boardHeight - y; }
    function xyToSquare(x, y) { return `${xToFile(x)}${yToRank(y)}`; }
    function squareToXY(sq) {
      const m = sq.match(/^([a-i])(10|[1-9])/);
      return { x: fileToX(m[1]), y: rankToY(parseInt(m[2], 10)) };
    }
    function parseSquareToken(str) {
      const m = str.match(/^([a-i])(10|[1-9])/);
      return { token: m[0] };
    }
    function splitUciMove(move) {
      const first = parseSquareToken(move);
      const rest = move.slice(first.token.length);
      const second = parseSquareToken(rest);
      return { from: first.token, to: second.token };
    }

    function parseFenPieces(fen) {
      const rows = fen.split(' ')[0].split('/');
      const pieces = [];
      for (let y = 0; y < rows.length; y++) {
        let x = 0;
        for (const ch of rows[y]) {
          if (/[0-9]/.test(ch)) {
            x += parseInt(ch, 10);
          } else {
            pieces.push({ x, y, piece: ch });
            x += 1;
          }
        }
      }
      return pieces;
    }

    function log(text) {
      const p = document.createElement('div');
      p.textContent = text;
      moveLog.prepend(p);
    }

    function syncBoardFromFfish() {
      const fen = board.fen();
      const pieces = parseFenPieces(fen);
      ui.pieceGlyphs = GLYPHS;
      ui.loadPosition(pieces.map((p) => ({ x: p.x, y: p.y, piece: p.piece })));
      ui.render();
    }

    function updateStatus() {
      if (gameOver) return;
      if (board.isGameOver()) {
        gameOver = true;
        statusLine.textContent = `게임 종료: ${board.result()}`;
        return;
      }
      const whoseTurn = (board.turn() ? 'w' : 'b') === humanColor ? '당신 차례' : 'AI 차례';
      statusLine.textContent = whoseTurn;
    }

    async function startNewGame() {
      statusLine.textContent = '엔진 불러오는 중...';
      try {
        if (!ffish) {
          ffish = await loadFfish();
        }
      } catch (e) {
        statusLine.textContent = '엔진 로드 실패';
        throw e;
      }
      if (board) board.delete();
      board = new ffish.Board(variantSelect.value);
      gameOver = false;
      selectedPoint = null;
      moveHistoryUci = [];
      moveLog.innerHTML = '';

      const cfg = BOARD_CONFIG[variantSelect.value] || BOARD_CONFIG.xiangqi;
      boardWidth = cfg.width;
      boardHeight = cfg.height;

      boardCol.innerHTML = '';
      ui = new IntersectionPieceBoard({
        container: boardCol,
        width: cfg.width,
        height: cfg.height,
        interactive: true,
        onPointClick: handlePointClick,
        pieceGlyphs: GLYPHS,
        palaces: cfg.palaces,
        riverGap: cfg.riverGap,
        pieceColorClasses: { light: 'ipb-piece-disk-red', dark: 'ipb-piece-disk-black' },
      });
      syncBoardFromFfish();
      updateStatus();
      log(`새 게임 시작 (${variantSelect.options[variantSelect.selectedIndex].text})`);
    }

    function legalMovesFromSquare(square) {
      const all = board.legalMoves().split(' ').filter((m) => m.length > 0);
      return all.filter((m) => splitUciMove(m).from === square);
    }

    function handlePointClick(x, y) {
      if (gameOver) return;
      const humanTurn = (board.turn() ? 'w' : 'b') === humanColor;
      if (!humanTurn) return;

      const clickedSquare = xyToSquare(x, y);

      if (selectedPoint) {
        const selectedSquare = xyToSquare(selectedPoint.x, selectedPoint.y);
        const moves = legalMovesFromSquare(selectedSquare);
        const target = moves.find((m) => splitUciMove(m).to === clickedSquare);
        if (target) {
          playMove(target);
          return;
        }
        selectedPoint = null;
        ui.setSelection(null, []);
        trySelect(x, y, clickedSquare);
      } else {
        trySelect(x, y, clickedSquare);
      }
    }

    function trySelect(x, y, square) {
      const moves = legalMovesFromSquare(square);
      if (moves.length === 0) return;
      selectedPoint = { x, y };
      ui.setSelection({ x, y }, moves.map((m) => squareToXY(splitUciMove(m).to)));
    }

    function playMove(uci) {
      board.push(uci);
      moveHistoryUci.push(uci);
      selectedPoint = null;
      const { from, to } = splitUciMove(uci);
      ui.markLastMove(squareToXY(from), squareToXY(to));
      syncBoardFromFfish();
      log(`당신: ${uci}`);
      updateStatus();

      if (!gameOver && (board.turn() ? 'w' : 'b') !== humanColor) {
        requestAiMove();
      }
    }

    async function requestAiMove() {
      thinkingEl.style.display = 'block';
      try {
        const res = await fetch('/api/variant-engine', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            variant: variantSelect.value,
            moves: moveHistoryUci,
            depth: currentDepth(),
          }),
        });
        const data = await res.json();
        if (data.gameOver || !data.uci) {
          thinkingEl.style.display = 'none';
          updateStatus();
          return;
        }
        board.push(data.uci);
        moveHistoryUci.push(data.uci);
        const { from, to } = splitUciMove(data.uci);
        ui.markLastMove(squareToXY(from), squareToXY(to));
        syncBoardFromFfish();
        log(`AI: ${data.uci}`);
      } catch (e) {
        log('AI 오류: ' + e.message);
      }
      thinkingEl.style.display = 'none';
      updateStatus();
    }

    document.getElementById('new-game-btn').addEventListener('click', startNewGame);
    document.getElementById('resign-btn').addEventListener('click', () => {
      if (gameOver) return;
      gameOver = true;
      statusLine.textContent = '기권했습니다.';
      log('기권');
    });
    document.getElementById('save-review-btn').addEventListener('click', () => {
      const games = JSON.parse(localStorage.getItem('board-arena-xiangqi-games') || '[]');
      games.unshift({
        id: Date.now(),
        savedAt: new Date().toISOString(),
        variant: variantSelect.value,
        moves: moveHistoryUci,
      });
      localStorage.setItem('board-arena-xiangqi-games', JSON.stringify(games.slice(0, 30)));
      saveMsg.style.display = 'block';
      setTimeout(() => (saveMsg.style.display = 'none'), 2500);
    });
    variantSelect.addEventListener('change', () => {
      updateVariantDesc();
      startNewGame();
    });

    updateVariantDesc();
    startNewGame();
  </script>
</body>
</html>
