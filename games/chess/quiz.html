<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>체스 퀴즈 - Board Arena</title>
<link rel="stylesheet" href="../../shared/css/common.css" />
<link rel="stylesheet" href="../../shared/css/square-board.css" />
<style>
  .layout { display: flex; gap: 28px; align-items: flex-start; flex-wrap: wrap; }
  .board-outer { flex-shrink: 0; }
  .board-with-ranks { display: flex; }
  .rank-labels { display: flex; flex-direction: column; width: 20px; }
  .rank-labels span { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #888; }
  .file-labels { display: flex; width: 460px; margin-left: 20px; }
  .file-labels span { flex: 1; text-align: center; font-size: 12px; color: #888; padding-top: 4px; }
  .board-col { width: 460px; aspect-ratio: 1 / 1; flex-shrink: 0; }
  .panel { flex: 1; min-width: 280px; }
  .panel button { padding: 8px 14px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; margin-right: 6px; margin-bottom: 10px; }
  .panel button.primary { background: var(--accent, #4a7cff); color: #fff; border-color: var(--accent, #4a7cff); }

  .quiz-filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; background: #f7f7f7; border-radius: 8px; padding: 12px 14px; }
  .quiz-filters label { font-size: 12px; color: #666; display: block; margin-bottom: 4px; }
  .quiz-filters select { padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; }
  .quiz-filters .filter-count { font-size: 12px; color: #999; align-self: flex-end; margin-left: auto; }

  .quiz-prompt { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  .quiz-meta { font-size: 12px; color: #888; margin-bottom: 12px; }
  .quiz-log { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .quiz-log-item { font-size: 13.5px; line-height: 1.6; padding: 8px 10px; border-radius: 6px; background: #f0f6ff; color: #1a3d7a; }
  .quiz-log-item.opp { background: #f5f5f5; color: #555; font-style: italic; }
  .quiz-summary { font-size: 14px; line-height: 1.7; color: #333; background: #eaf7ee; border: 1px solid #cdeed8; border-radius: 8px; padding: 12px 14px; margin: 10px 0; display: none; }
  .answer-diagram { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .answer-diagram-step { width: 150px; }
  .answer-diagram-board { width: 150px; height: 150px; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; }
  .answer-diagram-caption { font-size: 11px; color: #555; line-height: 1.4; margin-top: 4px; text-align: center; }
  .quiz-feedback { font-size: 14px; padding: 10px 12px; border-radius: 8px; margin: 10px 0; display: none; }
  .quiz-feedback.correct { background: #eaf7ee; color: #1c7a3a; display: block; }
  .quiz-feedback.wrong { background: #fdeceb; color: #b3261e; display: block; }
  .quiz-source { font-size: 12px; color: #999; margin-top: 14px; }
  .quiz-source a { color: var(--accent, #4a7cff); }

  .nav-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .quiz-nav-top { display:flex; gap:8px; margin-bottom:14px; }
  .quiz-nav-top a { display:inline-block; padding:7px 12px; border-radius:6px; border:1px solid var(--accent,#4a7cff); color:var(--accent,#4a7cff); text-decoration:none; font-size:13px; font-weight:600; }
</style>
</head>
<body>
  <main>
    <h1>체스 퀴즈</h1>
    <p style="font-size:13px;color:#777;margin-top:-6px;">Lichess 퍼즐 데이터베이스(CC0)에서 가져온, 실제 대국에서 나온 검증된 문제입니다.</p>

    <nav class="quiz-nav-top">
      <a href="play.html">◀ 대국으로 돌아가기</a>
    </nav>

    <div class="quiz-filters">
      <div>
        <label for="theme-select">유형</label>
        <select id="theme-select"><option value="">전체</option></select>
      </div>
      <div>
        <label for="level-select">난이도</label>
        <select id="level-select">
          <option value="">전체</option>
          <option value="0-800">입문 (~800)</option>
          <option value="800-1400">초급 (800~1400)</option>
          <option value="1400-2000">중급 (1400~2000)</option>
          <option value="2000-9999">고급 (2000~)</option>
        </select>
      </div>
      <div class="filter-count" id="filter-count"></div>
    </div>

    <div class="layout">
      <div class="board-outer">
        <div class="board-with-ranks">
          <div class="rank-labels">
            <span>8</span><span>7</span><span>6</span><span>5</span>
            <span>4</span><span>3</span><span>2</span><span>1</span>
          </div>
          <div id="board-col" class="board-col"></div>
        </div>
        <div class="file-labels">
          <span>a</span><span>b</span><span>c</span><span>d</span>
          <span>e</span><span>f</span><span>g</span><span>h</span>
        </div>
      </div>

      <div class="panel">
        <div class="quiz-prompt" id="quiz-prompt"></div>
        <div class="quiz-meta" id="quiz-meta"></div>

        <div class="quiz-log" id="quiz-log"></div>
        <div class="answer-diagram" id="answer-diagram"></div>
        <div class="quiz-summary" id="quiz-summary"></div>

        <div class="quiz-feedback" id="quiz-feedback"></div>

        <div class="nav-row">
          <button id="hint-btn">힌트 (첫 수만)</button>
          <button id="skip-btn">정답 보기</button>
          <button id="next-btn" class="primary" disabled>다음 문제</button>
        </div>

        <div class="quiz-source" id="quiz-source"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { Chess } from '../../shared/js/vendor/chess.js';
    import { SquareBoard } from '../../shared/js/square-board.js';

    const GLYPHS = {
      wk: '♔', wq: '♕', wr: '♖', wb: '♗', wn: '♘', wp: '♙',
      bk: '♚', bq: '♛', br: '♜', bb: '♝', bn: '♞', bp: '♟',
    };

    const THEME_LABELS = {
      mate: '외통', mateIn1: '외통(1수)', mateIn2: '외통(2수)', middlegame: '중반전',
      kingsideAttack: '킹사이드 공격', master: '마스터급', endgame: '엔드게임',
      pin: '핀', fork: '포크', advantage: '우세 확보', operaMate: '오페라메이트',
      backRankMate: '백랭크메이트', quietMove: '조용한 수',
    };

    const boardCol = document.getElementById('board-col');
    const promptEl = document.getElementById('quiz-prompt');
    const metaEl = document.getElementById('quiz-meta');
    const logEl = document.getElementById('quiz-log');
    const summaryEl = document.getElementById('quiz-summary');
    const answerDiagramEl = document.getElementById('answer-diagram');
    const feedbackEl = document.getElementById('quiz-feedback');
    const sourceEl = document.getElementById('quiz-source');
    const hintBtn = document.getElementById('hint-btn');
    const skipBtn = document.getElementById('skip-btn');
    const nextBtn = document.getElementById('next-btn');
    const themeSelect = document.getElementById('theme-select');
    const levelSelect = document.getElementById('level-select');
    const filterCountEl = document.getElementById('filter-count');

    let ALL_PROBLEMS = [];
    let FILTERED = [];
    let problemIndex = 0;
    let chess = new Chess();
    let board = null;
    let solveStep = 0;
    let solved = false;
    let selectedSquare = null;
    let solverColor = null;

    function squareToXY(sq) {
      const file = sq.charCodeAt(0) - 97;
      const rank = parseInt(sq[1], 10);
      return { x: file, y: 8 - rank };
    }
    function xyToSquare(x, y) {
      return String.fromCharCode(97 + x) + (8 - y);
    }

    function renderBoard() {
      const pieceList = [];
      for (let y = 0; y < 8; y++) {
        for (let x = 0; x < 8; x++) {
          const p = chess.get(xyToSquare(x, y));
          if (p) pieceList.push({ x, y, piece: p.color + p.type });
        }
      }
      board.pieceGlyphs = GLYPHS;
      board.loadPosition(pieceList);
      board.render();
    }

    function legalMovesFor(square) {
      return chess.moves({ square, verbose: true });
    }

    function applyFilters() {
      const theme = themeSelect.value;
      const level = levelSelect.value;
      FILTERED = ALL_PROBLEMS.filter((p) => {
        if (theme && !p.themes.includes(theme)) return false;
        if (level) {
          const [lo, hi] = level.split('-').map(Number);
          if (p.rating < lo || p.rating > hi) return false;
        }
        return true;
      });
      filterCountEl.textContent = `${FILTERED.length}문제 해당`;
      problemIndex = 0;
      if (FILTERED.length > 0) {
        loadProblem(0);
      } else {
        promptEl.textContent = '선택하신 조건에 맞는 문제가 없습니다. 필터를 조정해 보세요.';
        logEl.innerHTML = '';
        summaryEl.style.display = 'none';
        feedbackEl.style.display = 'none';
        nextBtn.disabled = true;
      }
    }

    function populateThemeOptions() {
      const themes = new Set();
      ALL_PROBLEMS.forEach((p) => p.themes.forEach((t) => themes.add(t)));
      [...themes].sort().forEach((t) => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = THEME_LABELS[t] || t;
        themeSelect.appendChild(opt);
      });
    }

    function loadProblem(idx) {
      const problem = FILTERED[idx];
      chess = new Chess();
      chess.load ? chess.load(problem.fen) : chess.load_fen ? chess.load_fen(problem.fen) : null;

      const setup = problem.setupMove;
      chess.move({ from: setup.slice(0, 2), to: setup.slice(2, 4), promotion: setup[4] });

      solverColor = chess.turn();
      solveStep = 0;
      solved = false;
      selectedSquare = null;

      if (!board) {
        board = new SquareBoard({ container: boardCol, width: 8, height: 8, interactive: true, onSquareClick: handleSquareClick, pieceGlyphs: GLYPHS });
      }
      renderBoard();
      board.setSelection(null, []);

      promptEl.textContent = `${solverColor === 'w' ? '백' : '흑'} 차례입니다. 최선의 수를 찾아보세요.`;
      metaEl.textContent = `난이도(레이팅) ${problem.rating} · 테마: ${problem.themes.map((t) => THEME_LABELS[t] || t).join(', ')}`;
      logEl.innerHTML = '';
      answerDiagramEl.innerHTML = '';
      summaryEl.style.display = 'none';
      feedbackEl.style.display = 'none';
      sourceEl.innerHTML = `출처: <a href="${problem.sourceUrl}" target="_blank" rel="noopener">Lichess 원본 문제</a> (CC0)`;
      nextBtn.disabled = true;
    }

    function handleSquareClick(x, y) {
      if (solved) return;
      const clickedSquare = xyToSquare(x, y);

      if (selectedSquare) {
        const legalMoves = legalMovesFor(selectedSquare);
        const target = legalMoves.find((m) => m.to === clickedSquare);
        if (target) {
          attemptMove(selectedSquare, clickedSquare, target.flags.includes('p') ? 'q' : undefined);
          selectedSquare = null;
          board.setSelection(null, []);
          return;
        }
      }

      const piece = chess.get(clickedSquare);
      if (piece && piece.color === solverColor) {
        selectedSquare = clickedSquare;
        const legalMoves = legalMovesFor(clickedSquare);
        // 빈 칸으로 이동하는 표시는 유지하되, "잡을 수 있는 칸"은 정답을 노출하므로 표시에서 제외
        const quietTargets = legalMoves.filter((m) => !m.flags.includes('c') && !m.flags.includes('e'));
        board.setSelection(squareToXY(clickedSquare), quietTargets.map((m) => squareToXY(m.to)));
      } else {
        selectedSquare = null;
        board.setSelection(null, []);
      }
    }

    function addLogLine(text, isOpponent = false) {
      const div = document.createElement('div');
      div.className = 'quiz-log-item' + (isOpponent ? ' opp' : '');
      div.textContent = text;
      logEl.appendChild(div);
    }

    function attemptMove(from, to, promotion) {
      const problem = FILTERED[problemIndex];
      const expected = problem.solution[solveStep];
      const played = from + to + (promotion || '');

      const isMateIn1 = problem.themes.includes('mateIn1') && solveStep === 0;

      const moveObj = chess.move({ from, to, promotion });
      if (!moveObj) return;

      const isCorrect = isMateIn1 ? (chess.in_checkmate?.() ?? chess.isCheckmate?.()) : played === expected;

      if (isCorrect) {
        // 방금 둔 수에 대한 해설을 즉시 표시 (전체 완료를 기다리지 않음)
        addLogLine(`✅ ${problem.moveComments[solveStep]}`);
        solveStep++;
        renderBoard();

        if (solveStep >= problem.solution.length) {
          finishPuzzle(problem, true);
        } else {
          // 상대의 응수를 자동 재생 + 그 수에 대한 코멘트도 표시
          const oppMove = problem.solution[solveStep];
          chess.move({ from: oppMove.slice(0, 2), to: oppMove.slice(2, 4), promotion: oppMove[4] });
          addLogLine(problem.moveComments[solveStep], true);
          solveStep++;
          renderBoard();

          if (solveStep >= problem.solution.length) {
            finishPuzzle(problem, true);
          } else {
            feedbackEl.className = 'quiz-feedback correct';
            feedbackEl.textContent = '맞았습니다! 상대의 응수 이후, 계속 최선수를 찾아보세요.';
            feedbackEl.style.display = 'block';
          }
        }
      } else {
        chess.undo();
        feedbackEl.className = 'quiz-feedback wrong';
        feedbackEl.textContent = '아쉽습니다. 다시 생각해보세요. (힌트 버튼을 눌러도 됩니다)';
        feedbackEl.style.display = 'block';
      }
    }

    function finishPuzzle(problem, wasCorrect) {
      solved = true;
      nextBtn.disabled = false;
      feedbackEl.className = 'quiz-feedback correct';
      feedbackEl.textContent = wasCorrect ? '정답입니다! 🎉' : '';
      feedbackEl.style.display = wasCorrect ? 'block' : 'none';
      summaryEl.textContent = `💡 총평: ${problem.why}`;
      summaryEl.style.display = 'block';
      renderAnswerDiagram(problem);
    }

    /** 정답 수순을 텍스트 대신 작은 보드 이미지로 한 수씩 보여줌 */
    function renderAnswerDiagram(problem) {
      answerDiagramEl.innerHTML = '';
      const replay = new Chess();
      replay.load ? replay.load(problem.fen) : replay.load_fen ? replay.load_fen(problem.fen) : null;
      const setup = problem.setupMove;
      replay.move({ from: setup.slice(0, 2), to: setup.slice(2, 4), promotion: setup[4] });

      problem.solution.forEach((uci, i) => {
        const from = uci.slice(0, 2), to = uci.slice(2, 4), promotion = uci[4];
        const moveObj = replay.move({ from, to, promotion });
        if (!moveObj) return;

        const pieceList = [];
        for (let y = 0; y < 8; y++) {
          for (let x = 0; x < 8; x++) {
            const p = replay.get(xyToSquare(x, y));
            if (p) pieceList.push({ x, y, piece: p.color + p.type });
          }
        }

        const stepEl = document.createElement('div');
        stepEl.className = 'answer-diagram-step';
        const boardHost = document.createElement('div');
        boardHost.className = 'answer-diagram-board';
        stepEl.appendChild(boardHost);

        const snapshotUi = new SquareBoard({ container: boardHost, width: 8, height: 8, interactive: false, pieceGlyphs: GLYPHS });
        snapshotUi.loadPosition(pieceList);
        snapshotUi.markLastMove(squareToXY(from), squareToXY(to));
        snapshotUi.render();

        const caption = document.createElement('div');
        caption.className = 'answer-diagram-caption';
        caption.textContent = `${i + 1}. ${moveObj.san}${i % 2 === 1 ? ' (상대)' : ''}`;
        stepEl.appendChild(caption);

        answerDiagramEl.appendChild(stepEl);
      });
    }

    hintBtn.addEventListener('click', () => {
      const problem = FILTERED[problemIndex];
      const expected = problem.solution[solveStep];
      if (!expected) return;
      const from = expected.slice(0, 2);
      feedbackEl.className = 'quiz-feedback correct';
      feedbackEl.textContent = `힌트: ${from}에 있는 기물을 움직여보세요.`;
      feedbackEl.style.display = 'block';
    });

    skipBtn.addEventListener('click', () => {
      const problem = FILTERED[problemIndex];
      for (let i = solveStep; i < problem.solution.length; i++) {
        addLogLine(problem.moveComments[i], i % 2 === 1);
      }
      feedbackEl.className = 'quiz-feedback wrong';
      feedbackEl.textContent = `정답 수순: ${problem.solution.join(' → ')}`;
      feedbackEl.style.display = 'block';
      finishPuzzle(problem, false);
    });

    nextBtn.addEventListener('click', () => {
      problemIndex = (problemIndex + 1) % FILTERED.length;
      loadProblem(problemIndex);
    });

    themeSelect.addEventListener('change', applyFilters);
    levelSelect.addEventListener('change', applyFilters);

    async function init() {
      try {
        const res = await fetch('./problems/chess-puzzles.json');
        if (!res.ok) throw new Error(`문제 파일을 불러오지 못했습니다 (${res.status})`);
        ALL_PROBLEMS = await res.json();
        populateThemeOptions();
        applyFilters();
      } catch (err) {
        promptEl.textContent = `문제를 불러오는 중 오류: ${err.message}`;
      }
    }

    init();
  </script>
</body>
</html>
